<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an Pro - Home</title>
     <script>
    // SCRIPT ANTI-KEDIP (Mata Genit)
    (function() {
        const isDark = localStorage.getItem('userDark') === 'true';
        const tipe = localStorage.getItem('tipeMushaf') || 'mushaf-1';
        
        // Cek batasan Mushaf 2 & 3 (gak boleh dark mode)
        const bolehDark = isDark && tipe !== 'mushaf-2' && tipe !== 'mushaf-3';

        if (bolehDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            // 'color-scheme' ini sakti, bikin scrollbar & background bawaan lgsg item
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.style.backgroundColor = '#121212';
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.style.backgroundColor = '#ffffff';
        }
    })();
</script>
    <link rel="stylesheet" href="css/style.css"> 
<style>
    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
    }
    /* Sembunyikan scrollbar saat splash muncul */
    body.loading { overflow: hidden; }
</style>
  </head>
   <body class="mushaf-1">
<div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(135deg, var(--primary), var(--primary-dark));   display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: opacity 0.8s ease, visibility 0.8s;">
    <div class="logo-container" style="text-align: center;">
        <img src="img/icon-quran.png" alt="Logo" style="width: 150px; height: 150px; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5)); animation: pulse 2s infinite ease-in-out;">
        <h1 style="color: #d4af37; font-family: 'Amiri', serif; margin-top: 20px; font-size: 28px; letter-spacing: 2px;">Al-Qur'an Pro</h1>
        <div style="width: 100px; height: 3px; background: linear-gradient(90deg, transparent, #d4af37, transparent); margin: 10px auto;"></div>
        <p style="color: #888; font-size: 12px; margin-top: 10px;">Menyiapkan Mushaf Digital...</p>
    </div>
</div>

<script>
    // Jalankan saat semua elemen selesai dimuat
    window.addEventListener('load', function() {
        const splash = document.getElementById('splash-screen');
        
        // Kasih jeda dikit biar user sempat lihat logo kerennya (misal 2 detik)
        setTimeout(() => {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            document.body.classList.remove('loading');
            
            // Trigger animasi geser app-container yang sudah ada
            const app = document.getElementById('app-container');
            if(app) {
                app.style.transform = "translateX(0)";
            }
        }, 3500); 
    });
</script>
<script type="text/javascript">
// Redirect to a new page after 3 seconds (3000 milliseconds)
setTimeout(function() {
    location.replace("home.html");
}, 3500);
</script></body>

</body>
</html>
